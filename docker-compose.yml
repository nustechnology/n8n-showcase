services:
  # One-shot database bootstrap: applies Prisma migrations and seeds RBAC.
  # Exits 0 on success; backend waits for it via service_completed_successfully.
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migration
    container_name: n8n-showcase-migrate
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://ecom_automation:${ECOMPG_PASSWORD}@db:5432/ecom_automation?schema=public}
    networks:
      - shared-network
    restart: "no"

  ecom-automation-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    container_name: n8n-showcase-backend
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql://ecom_automation:${ECOMPG_PASSWORD}@db:5432/ecom_automation?schema=public}
      - CLERK_ISSUER=${CLERK_ISSUER}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
      - APP_BASE_URL=${APP_BASE_URL:-http://ecom-automation-backend}
      - FRONTEND_URL=${FRONTEND_URL:-http://ecom-automation-frontend}
      - N8N_INTERNAL_TOKEN=${N8N_INTERNAL_TOKEN}
      - N8N_BASE_URL=https://ecom-automation.nustechnology.com/n8n/
      - SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID:-}
      - SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET:-}
      - SHOPIFY_SCOPES=${SHOPIFY_SCOPES:-read_orders}
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID:-}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - shared-network

  ecom-automation-frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://ecom-automation-backend}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/create-workspace}
        NEXT_PUBLIC_GEOAPIFY_API_KEY: ${NEXT_PUBLIC_GEOAPIFY_API_KEY:-}
    container_name: n8n-showcase-frontend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOSTNAME=0.0.0.0
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      - ecom-automation-backend
    networks:
      - default
      - shared-network

  ecom-automation-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-showcase-n8n
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_HOST=ecom-automation.nustechnology.com
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - HOSTNAME=0.0.0.0
      - WEBHOOK_URL=https://ecom-automation.nustechnology.com/n8n/
      - GENERIC_TIMEZONE=UTC
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PATH=/n8n/
      - N8N_EDITOR_BASE_URL=https://ecom-automation.nustechnology.com/n8n/
      - N8N_WEBHOOK_URL=https://ecom-automation.nustechnology.com/n8n/
      - N8N_PROXY_HOPS=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - ecom-automation-backend
    networks:
      - default
      - shared-network

networks:
  shared-network:
    name: shared-network
    external: true

volumes:
  n8n_data:

name: n8n-showcase
